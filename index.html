<style>
  :root{
    --bg:#0E0D11;
    --panel:#1B1820;
    --ink:#F3EFE8;
    --muted:#9C93A6;
    --red:#FF4D5E;
    --line:rgba(255,255,255,0.09);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(1100px circle at 12% -8%, rgba(255,77,94,0.14), transparent 58%),
      radial-gradient(900px circle at 108% 8%, rgba(255,77,94,0.09), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:'Inter', sans-serif; overflow-x:hidden;
  }
  @media (pointer:fine){ body{cursor:none;} a,button{cursor:none;} }
  .serif{font-family:'Poppins', sans-serif;}
  .mono{font-family:'Inter', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}
  #cdot,#cring{position:fixed; top:0; left:0; pointer-events:none; z-index:9999; border-radius:50%; transform:translate(-50%,-50%);}
  #cdot{width:7px; height:7px; background:var(--red);}
  #cring{width:34px; height:34px; border:2px solid var(--red); transition:width .18s ease,height .18s ease,background .18s ease;}
  #cring.big{width:60px; height:60px; background:rgba(255,49,49,0.15);}
  @media (pointer:coarse){ #cdot,#cring{display:none;} }
  nav{position:sticky; top:0; z-index:50; background:rgba(14,13,17,0.72); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--line);}
  nav .wrap{display:flex; align-items:center; justify-content:space-between; height:78px;}
  .logo{font-family:'Poppins', sans-serif; font-weight:700; font-size:20px;}
  .navlinks{display:flex; gap:8px; font-weight:600; font-size:14px;}
  .navlinks a{padding:8px 16px; border-radius:100px; transition:background .2s ease, color .2s ease;}
  .navlinks a:hover{background:var(--ink); color:var(--bg);}
  /* HERO */
  .hero{padding:120px 0 80px; text-align:center; display:flex; flex-direction:column; align-items:center;}
  .hero-eyebrow{font-family:'Inter', sans-serif; font-size:13px; color:var(--red); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:26px;}
  .title-wrap{position:relative; display:inline-block;}
  .wave-title{
    font-family:'Poppins', sans-serif; font-weight:900; font-size:clamp(38px,7vw,80px); line-height:1.05; color:var(--ink);
    text-transform:none; letter-spacing:0.01em; text-shadow:0 0 60px rgba(255,77,94,0.12);
  }
  .title-glow{
    position:absolute; top:0; left:0; margin:0; pointer-events:none;
    background:radial-gradient(circle 170px at var(--mx,50%) var(--my,50%), var(--red) 0%, rgba(255,77,94,0.6) 40%, rgba(255,77,94,0) 74%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; transition:opacity .45s ease;
  }
  .hero-sub{font-size:17px; color:var(--muted); max-width:440px; margin:26px auto 36px;}
  .hero-cta{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:36px;}
  .btn{padding:15px 26px; font-weight:600; font-size:14px; border:2px solid var(--ink); border-radius:100px; display:inline-flex; align-items:center; gap:8px; transition:transform .2s ease, background .2s ease, color .2s ease;}
  .btn-solid{background:var(--ink); color:var(--bg);}
  .btn-solid:hover{background:var(--red); border-color:var(--red); transform:translateY(-3px); box-shadow:0 0 34px rgba(255,77,94,0.4);}
  .btn-outline:hover{transform:translateY(-3px); border-color:var(--red); color:var(--red);}
  section{padding:90px 0;}
  section + section{margin-top:36px;}
  .section-eyebrow{font-family:'Inter', sans-serif; font-size:13px; color:var(--red); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px;}
  .section-title{
    font-family:'Poppins', sans-serif; font-weight:800; font-size:clamp(30px,4.2vw,44px); color:var(--ink);  line-height:1.1;
      margin:60px 0 20px 0;
}
  /* ABOUT - levelled sizing */
  .about-wrap{max-width:760px;}
  .about-text{font-size:17px; font-weight:400; line-height:1.8; color:var(--ink);}
  .about-text .redword{color:var(--red); font-style:italic; font-family:'Poppins', sans-serif;}
  /* LONG-FORM WORK - horizontal slider */    
  .hscroll{display:flex; gap:22px; overflow-x:auto; scroll-snap-type:x mandatory; padding:20px 4px 18px; -webkit-overflow-scrolling:touch; scrollbar-width:none; -ms-overflow-style:none; cursor:grab; user-select:none;}
  .hscroll::-webkit-scrollbar{display:none;}
  .hscroll.dragging{cursor:grabbing; scroll-snap-type:none;}
  .card{
    flex:0 0 320px; scroll-snap-align:start; background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden;
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease; transform-origin:center; display:block;
  }
  .card:hover{transform:scale(1.06); border-color:var(--red); box-shadow:0 20px 50px rgba(0,0,0,0.5), 0 0 26px rgba(255,77,94,0.18);}
  .card-thumb{height:190px; overflow:hidden; border-radius:18px 18px 0 0;}
  .card-thumb-img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-body{padding:22px 24px 26px; text-align:left;}
  .card-body .no{font-family:'Inter', sans-serif; color:var(--red); font-size:12px; margin-bottom:8px;}
  .card-body h3{
    font-family:'Poppins', sans-serif; font-size:19px; font-weight:700; margin-bottom:6px; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em;
  }
  .card-body p{font-size:13.5px; color:var(--muted);}
  /* SLIDER ARROWS */
  .slider-wrap{position:relative;}
  .slide-btn{
    position:absolute; top:50%; transform:translateY(-50%); z-index:10;
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
    background:rgba(27,24,32,0.85); backdrop-filter:blur(8px); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:18px;
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .slide-btn:hover{background:var(--red); border-color:var(--red); color:var(--bg);}
  .slide-btn.prev{left:-8px;}
  .slide-btn.next{right:-8px;}
  @media (max-width:820px){ .slide-btn{display:none;} }
  /* SHORT-FORM WORK - horizontal slider */
  .short-card{
    flex:0 0 210px; scroll-snap-align:start; aspect-ratio:9/16; border-radius:14px; border:1px solid var(--line);
    position:relative; overflow:hidden; background:var(--panel); cursor:pointer;
    transition:transform .3s ease, border-color .3s ease; transform-origin:center;
  }
  .short-card:hover{transform:scale(1.06); border-color:var(--red); box-shadow:0 20px 50px rgba(0,0,0,0.5), 0 0 26px rgba(255,77,94,0.18);}
  .short-thumb{width:100%; height:100%; object-fit:cover; display:block;}
  .play-badge{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%; background:rgba(34,26,18,0.55); backdrop-filter:blur(4px);
    color:var(--bg); display:flex; align-items:center; justify-content:center; font-size:18px; padding-left:3px;
    transition:background .25s ease, transform .25s ease;
  }
  .short-card:hover .play-badge{background:var(--red); transform:translate(-50%,-50%) scale(1.08);}
  /* REVIEWS - horizontal slider */
  .reviews-title{font-family:'Poppins', sans-serif; font-weight:800; font-size:36px; color:var(--ink);     margin:45px 0;
}
  .review-card{
    flex:0 0 340px; scroll-snap-align:start; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px;
    display:flex; flex-direction:column; gap:16px; transition:transform .3s ease, border-color .3s ease; transform-origin:center;
  }
  .review-card:hover{transform:scale(1.06); border-color:var(--red); box-shadow:0 20px 50px rgba(0,0,0,0.5), 0 0 26px rgba(255,77,94,0.18);}
  .review-card{cursor:pointer;}
  .review-head{display:flex; align-items:center; gap:12px;}
  .review-logo{width:42px; height:42px; border-radius:50%; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:center; font-family:'Poppins', sans-serif; font-weight:700; font-size:15px; flex-shrink:0;}
  .review-meta .name{font-weight:700; font-size:14px;}
  .review-meta .subs{font-family:'Inter', sans-serif; font-size:10.5px; color:var(--muted); margin-top:2px;}
  .review-text{font-family:'Poppins', sans-serif; font-style:italic; font-size:14.5px; line-height:1.6; color:var(--ink);}
  /* MORE TILES */
  .more-tile{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:var(--panel); border:1px dashed var(--line); border-radius:18px; padding:24px;
    transition:transform .3s ease, border-color .3s ease; transform-origin:center; text-align:center;
  }
  .more-tile:hover{transform:scale(1.06); border-color:var(--red); box-shadow:0 20px 50px rgba(0,0,0,0.5), 0 0 26px rgba(255,77,94,0.18);}
  .more-tile .arrow-circle{
    width:48px; height:48px; border-radius:50%; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center;
    font-size:20px; transition:border-color .3s ease, background .3s ease, color .3s ease;
  }
  .more-tile:hover .arrow-circle{background:var(--red); border-color:var(--red); color:var(--bg);}
  .more-tile .more-label{font-family:'Inter', sans-serif; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink); transition:color .3s ease;}
  .more-tile:hover .more-label{color:var(--red);}
  .more-tile.long{flex:0 0 220px;}
  .more-tile.short{flex:0 0 150px; aspect-ratio:9/16;}
  .more-tile.reviews{flex:0 0 220px;}
  /* CONTACT - reduced size */
  .contact-section{background:var(--ink); color:var(--bg); border-radius:22px; margin:0 32px; padding:40px 36px;}
  .contact-inner{max-width:860px; margin:0 auto;}
  h2.contact-title{font-family:'Poppins', sans-serif; font-size:clamp(22px,3.8vw,34px); font-weight:700; margin-bottom:24px;}
  h2.contact-title em{color:var(--red); font-style:italic;}
  .email-row{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; border:2px solid var(--bg); border-radius:14px; padding:20px 24px; margin-bottom:22px; transition:background .2s ease, transform .2s ease;}
  .email-row:hover{background:var(--red); border-color:var(--red); transform:translateY(-3px);}
  .email-row .label{font-family:'Inter', sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--red); margin-bottom:5px;}
  .email-row:hover .label{color:var(--ink);}
  .email-row .addr{font-family:'Poppins', sans-serif; font-size:clamp(18px,2.8vw,26px); word-break:break-all; font-weight:700;}
  .email-row .arrow{font-size:22px;}
  .social-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .social-btn{display:flex; flex-direction:column; gap:10px; border:2px solid var(--bg); border-radius:14px; padding:18px 18px; font-weight:600; font-size:13.5px; transition:transform .2s ease, background .2s ease;}
  .social-btn svg{width:20px; height:20px;}
  .social-btn .go{font-family:'Inter', sans-serif; font-size:10.5px; color:var(--bg); opacity:0.65;}
  .social-btn:hover{transform:translateY(-5px) scale(1.02);}
  .social-btn.ig:hover{background:#E1306C; border-color:#E1306C;}
  .social-btn.tw:hover{background:#1D9BF0; border-color:#1D9BF0;}
  .social-btn.dc:hover{background:#5865F2; border-color:#5865F2;}
  .social-btn.yj:hover{background:#FF6A00; border-color:#FF6A00;}
  footer{padding:34px 0; display:flex; justify-content:space-between; font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); flex-wrap:wrap; gap:12px;}
  /* REVIEW MODAL */
  .modal-overlay{
    position:fixed; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center;
    background:rgba(34,26,18,0.35); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    opacity:0; pointer-events:none; transition:opacity .3s ease; padding:0;
  }
  .modal-overlay.open{opacity:1; pointer-events:auto;}
  .modal-box{
    background:var(--panel); border:none; border-radius:0; padding:60px;
    max-width:none; width:100%; height:100%; position:relative; box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
    transform:scale(0.97); transition:transform .3s ease; overflow-y:auto;
  }
  .modal-overlay.open .modal-box{transform:scale(1);}
  .modal-close{
    position:absolute; top:28px; right:28px; width:44px; height:44px; border-radius:50%; border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; background:transparent;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .modal-close:hover{background:var(--red); border-color:var(--red); color:var(--bg);}
  .modal-head{display:flex; flex-direction:column; align-items:center; gap:16px; margin-bottom:32px;}
  .modal-logo{width:80px; height:80px; border-radius:50%; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:center; font-family:'Poppins', sans-serif; font-weight:700; font-size:28px; flex-shrink:0;}
  .modal-name{font-weight:700; font-size:24px;}
  .modal-subs{font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); margin-top:6px;}
  .modal-text{font-family:'Poppins', sans-serif; font-style:italic; font-size:clamp(20px,3vw,32px); line-height:1.6; color:var(--ink); max-width:760px;}
  .modal-channel-link{
    margin-top:30px; display:inline-flex; align-items:center; gap:8px;
    font-size:14px; font-weight:600; color:var(--red); border:1px solid var(--red); border-radius:100px;
    padding:10px 20px; transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .modal-channel-link:hover{background:var(--red); color:var(--panel); transform:translateY(-2px);}
  .modal-channel-link .arrow{font-size:16px;}
  body.modal-locked{overflow:hidden;}
  /* SHORTS PLAYER MODAL */
  .shorts-overlay{
    position:fixed; inset:0; z-index:2100; display:flex; align-items:center; justify-content:center;
    background:rgba(34,26,18,0.5); backdrop-filter:blur(26px); -webkit-backdrop-filter:blur(26px);
    opacity:0; pointer-events:none; transition:opacity .35s ease; overflow:hidden; padding:24px;
  }
  .shorts-overlay.open{opacity:1; pointer-events:auto;}
  .shorts-bg-anim{position:absolute; inset:-10%; pointer-events:none; z-index:0;}
  .shorts-blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:0.28; will-change:transform;}
  .shorts-blob.b1{width:340px; height:340px; background:var(--red); top:8%; left:12%; animation:floatBlob1 20s ease-in-out infinite;}
  .shorts-blob.b2{width:300px; height:300px; background:var(--panel); bottom:10%; right:14%; opacity:0.18; animation:floatBlob2 26s ease-in-out infinite;}
  .shorts-blob.b3{width:260px; height:260px; background:var(--red); top:45%; right:20%; opacity:0.16; animation:floatBlob3 23s ease-in-out infinite;}
  @keyframes floatBlob1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(50px,-35px) scale(1.12);} }
  @keyframes floatBlob2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-45px,30px) scale(0.92);} }
  @keyframes floatBlob3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.08);} }
  .shorts-player-wrap{
    position:relative; z-index:2; width:min(380px, 82vh * 9 / 16, 86vw); aspect-ratio:9/16;
    border-radius:26px; overflow:hidden; background:#000; box-shadow:0 40px 90px rgba(0,0,0,0.45);
    transform:scale(0.94); transition:transform .35s ease;
  }
  .shorts-overlay.open .shorts-player-wrap{transform:scale(1);}
  .shorts-player-wrap video{width:100%; height:100%; object-fit:cover; display:block; background:#000;}
  .shorts-close{
    position:absolute; z-index:3; top:-54px; right:0; width:40px; height:40px; border-radius:50%;
    border:2px solid var(--bg); background:transparent; color:var(--bg); display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:700; transition:background .2s ease, border-color .2s ease;
  }
  .shorts-close:hover{background:var(--red); border-color:var(--red);}
  @media (max-width:820px){
    .social-grid{grid-template-columns:1fr;}
    .navlinks{gap:2px; font-size:12px;}
    .contact-section{margin:0 16px; padding:36px 22px;}
    .wrap{padding:0 20px;}
    .card{flex:0 0 250px;}
    .card-thumb{height:145px;}
    .card-body{padding:16px 18px 20px;}
    .card-body h3{font-size:16px; min-height:2.4em;}
    .short-card{flex:0 0 130px;}
    .review-card{flex:0 0 280px; padding:20px;}
    .hscroll{gap:14px;}
    .more-tile.long{flex:0 0 160px;}
    .more-tile.short{flex:0 0 110px;}
    .more-tile.reviews{flex:0 0 160px;}
    .section-title{font-size:clamp(24px,7vw,34px); margin:40px 0 16px 0;}
    .reviews-title{font-size:26px; margin:30px 0;}
    .modal-box{padding:32px 24px;}
    .modal-text{font-size:18px;}
  }
  /* MOBILE NAV */
  .mobile-menu-btn,.mobile-menu-panel{display:none;}
  /* LONG-FORM VIDEO PLAYER MODAL */
  .video-overlay{
    position:fixed; inset:0; z-index:2200;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(14,13,17,.48);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
  }
  .video-overlay.open{opacity:1; pointer-events:auto;}
  .video-modal{
    position:relative; width:min(860px,92vw); max-height:90vh; overflow:hidden;
    background:var(--panel); border:1px solid var(--line); border-radius:22px;
    box-shadow:0 35px 100px rgba(0,0,0,.55);
    transform:translateY(12px) scale(.98); transition:transform .3s ease;
  }
  .video-overlay.open .video-modal{transform:translateY(0) scale(1);}
  .video-frame{position:relative; width:100%; aspect-ratio:16/9; background:#000;}
  .video-frame iframe{width:100%; height:100%; border:0; display:block;}
  .video-modal-info{padding:18px 22px 20px;}
  .video-modal-title{font-family:'Po
