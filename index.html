<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pranav — Video Editor</title>
<meta name="description" content="Pranav is a video editor working across documentaries, commentary, and short-form content.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ffffff;
    --base: #0a0a0a;
    --pad: clamp(1.25rem, 3.5vw, 3rem);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--base);
    color: var(--ink);
    font-family: "Sora", "Helvetica Neue", Arial, sans-serif;
    font-weight: 200;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .hero { position: relative; width: 100%; height: 100%; min-height: 100svh; }

  .hero video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* soft shade so thin white text stays readable on any frame */
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 22%),
      linear-gradient(to top, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 40%);
    pointer-events: none;
  }

  nav {
    position: absolute; z-index: 2;
    top: 0; right: 0;
    padding: var(--pad);
    display: flex; gap: clamp(1.25rem, 3vw, 2.75rem);
  }
  nav a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 300;
    font-size: clamp(.85rem, 1.1vw, 1rem);
    letter-spacing: .02em;
    padding-bottom: .2rem;
    border-bottom: 1px solid transparent;
    transition: border-color .25s ease;
  }
  nav a:hover { border-bottom-color: var(--ink); }
  nav a:focus-visible, .hero a:focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; }

  .intro {
    position: absolute; z-index: 2;
    top: 61%; left: 50%;
    transform: translateX(-50%);
    width: min(40rem, 88vw);
    text-align: center;
    font-weight: 200;
    font-size: clamp(.95rem, 1.35vw, 1.3rem);
    line-height: 1.4;
    letter-spacing: -.005em;
  }

  @media (max-width: 600px) {
    nav { gap: 1rem; flex-wrap: wrap; justify-content: flex-end; }
  }
</style>
</head>
<body>
  <header class="hero">
    <video id="bg" autoplay muted loop playsinline preload="auto" poster="poster.jpg">
      <source src="hero.mp4" type="video/mp4">
    </video>

    <nav aria-label="Main">
      <a href="#about">About me</a>
      <a href="#works">Works</a>
      <a href="#reviews">Reviews</a>
      <a href="#contact">Contact</a>
    </nav>

    <p class="intro">Pranav is a video editor working across documentaries, commentary, and short-form content, with a focus on pacing, music, sound design, and visual storytelling.</p>
  </header>

  <script>
    // Make sure the background video always plays (muted autoplay is allowed by browsers)
    var v = document.getElementById("bg");
    v.muted = true;
    var tryPlay = function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
    tryPlay();
    v.addEventListener("loadeddata", tryPlay);
    document.addEventListener("click", tryPlay, { once: true });
  </script>
</body>
</html>
