<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0714">
<title>A message from Pranav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0714;
    --void-2:#120b22;
    --card:#160f28;
    --card-edge:#2a1a4a;
    --violet:#8b5cf6;
    --violet-bright:#c084fc;
    --violet-deep:#4c1d95;
    --ink:#f2edff;
    --ink-dim:#a898c9;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;
    height:100%;
    background:
      radial-gradient(ellipse 700px 500px at 50% 20%, rgba(139,92,246,0.16), transparent 60%),
      radial-gradient(ellipse 900px 700px at 80% 90%, rgba(76,29,149,0.20), transparent 60%),
      var(--void);
    overflow:hidden;
    font-family:'Inter', sans-serif;
    overscroll-behavior:none;
  }
  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
  }

  /* ambient floating specks */
  .speck{
    position:absolute;
    width:4px; height:4px;
    border-radius:50%;
    background:var(--violet-bright);
    opacity:0.35;
    filter:blur(0.5px);
    animation:drift 9s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translateY(0) translateX(0); opacity:0.15;}
    50%{ transform:translateY(-40px) translateX(10px); opacity:0.55;}
  }

  /* ---------- Notification card ---------- */
  #card{
    position:relative;
    z-index:5;
    width:min(360px, 86vw);
    background:linear-gradient(165deg, var(--card), var(--void-2));
    border:1px solid var(--card-edge);
    border-radius:22px;
    padding:28px 24px 30px;
    text-align:center;
    box-shadow:
      0 0 0 1px rgba(139,92,246,0.05),
      0 20px 60px rgba(0,0,0,0.55),
      0 0 40px rgba(139,92,246,0.10);
    cursor:pointer;
    transition:transform 0.35s ease, box-shadow 0.35s ease, opacity 0.5s ease;
    -webkit-user-select:none;
    user-select:none;
  }
  #card:active{
    transform:scale(0.97);
  }
  #card.hide{
    opacity:0;
    transform:scale(0.9);
    pointer-events:none;
  }

  .pill{
    display:inline-block;
    font-family:'Inter', sans-serif;
    font-size:11px;
    font-weight:500;
    letter-spacing:0.4px;
    color:var(--violet-bright);
    background:rgba(139,92,246,0.12);
    border:1px solid rgba(139,92,246,0.28);
    padding:5px 12px;
    border-radius:100px;
    margin-bottom:16px;
  }

  .msg-line{
    font-family:'Baloo 2', sans-serif;
    font-size:19px;
    font-weight:600;
    line-height:1.45;
    color:var(--ink);
  }
  .msg-line b{
    color:var(--violet-bright);
    font-weight:700;
  }

  .giftwrap{
    margin:22px auto 14px;
    width:120px;
    height:110px;
    position:relative;
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-1.5deg); }
    50%{ transform:translateY(-9px) rotate(1.5deg); }
  }

  .tap-hint{
    margin-top:6px;
    font-size:13px;
    font-weight:500;
    color:var(--ink-dim);
    letter-spacing:0.2px;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.55; }
    50%{ opacity:1; }
  }

  /* ---------- Gift box (opening state, shown centered on stage) ---------- */
  #giftScene{
    position:absolute;
    width:180px; height:180px;
    display:flex; align-items:flex-end; justify-content:center;
    z-index:4;
    opacity:0;
    pointer-events:none;
  }
  #giftScene.active{ opacity:1; }

  .box-base{
    position:absolute;
    bottom:20px;
    width:120px; height:70px;
    transform-origin:center bottom;
    transition:transform 0.5s ease 0.55s, opacity 0.5s ease 0.55s;
  }
  .box-lid{
    position:absolute;
    bottom:78px;
    width:132px; height:34px;
    transform-origin:10% 100%;
    transition:transform 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  #giftScene.opening .box-lid{
    transform:rotate(-115deg) translate(-4px, -2px);
  }
  #giftScene.opening .box-base{
    transform:scale(0.85);
    opacity:0;
  }
  #giftScene.gone .box-lid{
    opacity:0;
    transition:opacity 0.4s ease;
  }

  .burst{
    position:absolute;
    bottom:60px;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--violet-bright);
    opacity:0;
  }
  #giftScene.opening .burst{
    animation:burstOut 0.7s ease-out forwards;
  }
  @keyframes burstOut{
    0%{ opacity:1; transform:translate(0,0) scale(1);}
    100%{ opacity:0; transform:translate(var(--bx,0), var(--by,-60px)) scale(0.3);}
  }

  /* ---------- Pigeon ---------- */
  #pigeon{
    position:absolute;
    bottom:58px;
    width:118px; height:100px;
    opacity:0;
    transform:translateY(10px) scale(0.4);
    transition:opacity 0.4s ease 0.35s;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,0.45));
  }
  #giftScene.opening #pigeon{
    opacity:1;
    animation:pigeonRise 1.6s cubic-bezier(.22,.68,.35,1) 0.42s forwards;
  }
  @keyframes pigeonRise{
    0%{ transform:translateY(10px) scale(0.35) rotate(0deg); }
    30%{ transform:translateY(-55px) scale(0.75) rotate(-5deg); }
    60%{ transform:translateY(-92px) scale(0.92) rotate(3deg); }
    80%{ transform:translateY(-108px) scale(1) rotate(-1deg); }
    100%{ transform:translateY(-104px) scale(1) rotate(0deg); }
  }
  #pigeon .wing-back{
    transform-box:fill-box;
    transform-origin:70% 40%;
    animation:flapBack 0.26s ease-in-out infinite alternate;
  }
  #pigeon .wing-front{
    transform-box:fill-box;
    transform-origin:60% 35%;
    animation:flapFront 0.26s ease-in-out infinite alternate;
  }
  @keyframes flapFront{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(-24deg); }
  }
  @keyframes flapBack{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(-14deg); }
  }
  #pigeon .settle{
    animation-play-state:running;
  }

  /* gentle idle bob once pigeon has risen, purely decorative */
  #giftScene.opening #pigeon{
    animation-fill-mode:forwards;
  }

  /* ---------- Reveal text sequence ---------- */
  #textSeq{
    position:absolute;
    bottom:9%;
    width:min(380px, 88vw);
    text-align:center;
    z-index:6;
  }
  .seq-line{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:var(--ink);
    opacity:0;
    transform:translateY(14px);
    transition:opacity 0.5s ease, transform 0.5s ease;
    display:none;
  }
  .seq-line.show{
    display:block;
    opacity:1;
    transform:translateY(0);
  }
  #line1{ font-size:26px; color:var(--violet-bright); }
  #line2{ font-size:19px; margin-top:10px; color:var(--ink); font-weight:600; }
  #line3{
    font-size:15px;
    margin-top:14px;
    font-family:'Inter', sans-serif;
    font-weight:500;
    color:var(--ink-dim);
    font-style:italic;
  }
</style>
</head>
<body>

<div id="stage">

  <!-- notification card -->
  <div id="card" onclick="openGift()">
    <span class="pill">New message</span>
    <div class="msg-line">Hey <b>Jyoti / Reena</b>, Pranav has sent you a message.</div>

    <div class="giftwrap">
      <svg viewBox="0 0 120 110" width="120" height="110">
        <rect x="10" y="42" width="100" height="60" rx="6" fill="#3a1f66" stroke="#8b5cf6" stroke-width="2"/>
        <rect x="10" y="42" width="100" height="60" rx="6" fill="url(#boxGrad)" opacity="0.55"/>
        <rect x="52" y="42" width="16" height="60" fill="#c084fc" opacity="0.85"/>
        <rect x="2" y="26" width="116" height="20" rx="6" fill="#4c1d95" stroke="#a855f7" stroke-width="2"/>
        <rect x="52" y="26" width="16" height="20" fill="#c084fc" opacity="0.9"/>
        <path d="M60 26 C46 8, 30 8, 34 22 C36 30, 52 28, 60 26 Z" fill="#a855f7"/>
        <path d="M60 26 C74 8, 90 8, 86 22 C84 30, 68 28, 60 26 Z" fill="#a855f7"/>
        <defs>
          <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#3a1f66"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="tap-hint">Tap to open ✦</div>
  </div>

  <!-- opening gift scene -->
  <div id="giftScene">
    <svg class="box-lid" viewBox="0 0 132 34" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="6" width="128" height="20" rx="6" fill="#4c1d95" stroke="#a855f7" stroke-width="2"/>
      <rect x="58" y="6" width="16" height="20" fill="#c084fc" opacity="0.9"/>
      <path d="M66 8 C52 -8, 36 -8, 40 6 C42 14, 58 12, 66 8 Z" fill="#a855f7"/>
      <path d="M66 8 C80 -8, 96 -8, 92 6 C90 14, 74 12, 66 8 Z" fill="#a855f7"/>
    </svg>

    <!-- more realistic pigeon illustration -->
    <svg id="pigeon" viewBox="0 0 160 130" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c9cdd9"/>
          <stop offset="55%" stop-color="#9fa5b5"/>
          <stop offset="100%" stop-color="#767d90"/>
        </linearGradient>
        <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7f8494"/>
          <stop offset="100%" stop-color="#5c6272"/>
        </linearGradient>
        <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85"/>
          <stop offset="50%" stop-color="#5fb88a" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
        </linearGradient>
        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8b909f"/>
          <stop offset="100%" stop-color="#565c6c"/>
        </linearGradient>
      </defs>

      <!-- tail -->
      <path d="M118 78 C138 74, 152 82, 148 96 C136 92, 122 90, 110 84 Z" fill="url(#wingGrad)"/>
      <path d="M144 84 C150 86, 152 92, 148 96 C144 94, 140 90, 138 87 Z" fill="#3d4150"/>

      <!-- back wing (flaps less) -->
      <g class="wing-back">
        <path d="M78 62 C100 50, 118 58, 112 78 C98 80, 84 76, 74 66 Z" fill="url(#wingGrad)"/>
        <path d="M92 58 C106 54, 116 60, 112 70" stroke="#454a58" stroke-width="2" fill="none" opacity="0.6"/>
      </g>

      <!-- body -->
      <ellipse cx="72" cy="80" rx="40" ry="28" fill="url(#bodyGrad)"/>
      <ellipse cx="60" cy="96" rx="24" ry="12" fill="#c9cdd9" opacity="0.55"/>

      <!-- neck sheen -->
      <ellipse cx="46" cy="60" rx="14" ry="12" fill="url(#sheenGrad)"/>

      <!-- head -->
      <circle cx="36" cy="52" r="18" fill="url(#headGrad)"/>
      <circle cx="36" cy="52" r="18" fill="url(#sheenGrad)" opacity="0.25"/>

      <!-- eye -->
      <circle cx="28" cy="49" r="4.2" fill="#2a2530"/>
      <circle cx="28" cy="49" r="4.2" fill="none" stroke="#e8873f" stroke-width="1.6"/>
      <circle cx="26.6" cy="47.6" r="1" fill="#fff" opacity="0.9"/>

      <!-- beak -->
      <path d="M17 51 C10 51.5, 5 53.5, 2 56 C6 57.5, 11 58, 17 57 Z" fill="#3a3a42"/>
      <ellipse cx="16" cy="49.5" rx="4" ry="2.6" fill="#d9d3e0"/>

      <!-- front wing (flaps more, drawn over body) -->
      <g class="wing-front">
        <path d="M66 58 C94 42, 122 54, 116 78 C98 82, 78 76, 62 64 Z" fill="url(#wingGrad)"/>
        <path d="M78 52 C96 46, 112 52, 110 64" stroke="#454a58" stroke-width="2.2" fill="none" opacity="0.55"/>
        <path d="M72 60 C92 54, 108 60, 104 72" stroke="#3d4150" stroke-width="2.2" fill="none" opacity="0.45"/>
        <path d="M96 60 C104 64, 108 70, 104 76 C98 74, 92 70, 90 66 Z" fill="#33353f" opacity="0.85"/>
      </g>

      <!-- legs -->
      <path d="M58 106 L54 122 M78 106 L82 121" stroke="#c96b6b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M54 122 L48 125 M54 122 L54 126 M54 122 L59 125" stroke="#c96b6b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M82 121 L76 125 M82 121 L82 126 M82 121 L88 124" stroke="#c96b6b" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>

    <svg class="box-base" viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="112" height="62" rx="6" fill="url(#boxGrad2)" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="52" y="4" width="16" height="62" fill="#c084fc" opacity="0.85"/>
      <defs>
        <linearGradient id="boxGrad2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#2a1750"/>
        </linearGradient>
      </defs>
    </svg>

    <div class="burst" style="left:40%; --bx:-30px; --by:-70px;"></div>
    <div class="burst" style="left:50%; --bx:6px; --by:-90px;"></div>
    <div class="burst" style="left:62%; --bx:34px; --by:-65px;"></div>
    <div class="burst" style="left:46%; --bx:-10px; --by:-100px;"></div>
    <div class="burst" style="left:58%; --bx:20px; --by:-80px;"></div>
  </div>

  <!-- text sequence -->
  <div id="textSeq">
    <div class="seq-line" id="line1">Oh, congratulations! 🎉</div>
    <div class="seq-line" id="line2">Pranav has sent you a pigeon.</div>
    <div class="seq-line" id="line3">Now use this to reply, since Pranav's getting to it late anyway.</div>
  </div>

</div>

<script>
  // ambient specks
  const stage = document.getElementById('stage');
  for(let i=0;i<22;i++){
    const s = document.createElement('div');
    s.className = 'speck';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*6) + 's';
    s.style.animationDuration = (7 + Math.random()*6) + 's';
    stage.insertBefore(s, stage.firstChild);
  }

  let opened = false;
  function openGift(){
    if(opened) return;
    opened = true;

    const card = document.getElementById('card');
    const scene = document.getElementById('giftScene');

    card.classList.add('hide');
    scene.classList.add('active');

    requestAnimationFrame(()=>{
      setTimeout(()=> scene.classList.add('opening'), 40);
    });

    // box fully disappears after opening
    setTimeout(()=> scene.classList.add('gone'), 950);

    // reveal text sequence
    const l1 = document.getElementById('line1');
    const l2 = document.getElementById('line2');
    const l3 = document.getElementById('line3');

    setTimeout(()=> l1.classList.add('show'), 1600);
    setTimeout(()=> l2.classList.add('show'), 2550);
    setTimeout(()=> l3.classList.add('show'), 3550);
  }
</script>

</body>
          </html>
